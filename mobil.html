<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Mobil</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #222;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin: 10px;
            color: #00ff88;
        }

        #score {
            font-size: 22px;
            margin-bottom: 10px;
        }

        #game {
            position: relative;
            width: 400px;
            height: 600px;
            margin: auto;
            overflow: hidden;
            background: #555;
            border-left: 8px solid white;
            border-right: 8px solid white;
        }

        /* Garis jalan */
        .road-line {
            position: absolute;
            width: 10px;
            height: 80px;
            background: white;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Mobil pemain */
        #player {
            position: absolute;
            width: 55px;
            height: 90px;
            background: red;
            bottom: 30px;
            left: 172px;
            border-radius: 12px;
            z-index: 5;
        }

        #player::before {
            content: "";
            position: absolute;
            width: 35px;
            height: 35px;
            background: #55ccff;
            top: 10px;
            left: 10px;
            border-radius: 5px;
        }

        /* Roda */
        #player::after {
            content: "⚫   ⚫";
            position: absolute;
            font-size: 15px;
            bottom: 5px;
            left: 5px;
            white-space: pre;
        }

        /* Mobil musuh */
        .enemy {
            position: absolute;
            width: 55px;
            height: 90px;
            background: yellow;
            border-radius: 12px;
            top: -100px;
            z-index: 4;
        }

        .enemy::before {
            content: "";
            position: absolute;
            width: 35px;
            height: 35px;
            background: #333;
            top: 10px;
            left: 10px;
            border-radius: 5px;
        }

        #gameOver {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
            padding-top: 180px;
        }

        #gameOver h2 {
            color: red;
            font-size: 40px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            background: #00cc66;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #00994d;
        }

        .info {
            margin-top: 10px;
            font-size: 16px;
        }

        @media (max-width: 450px) {
            #game {
                width: 95vw;
                height: 80vh;
            }
        }
    </style>
</head>

<body>

    <h1>🏎️ GAME MOBIL</h1>
    <div id="score">Skor: 0</div>

    <div id="game">

        <div class="road-line" style="top: 0px;"></div>
        <div class="road-line" style="top: 150px;"></div>
        <div class="road-line" style="top: 300px;"></div>
        <div class="road-line" style="top: 450px;"></div>

        <div id="player"></div>

        <div id="gameOver">
            <h2>💥 GAME OVER!</h2>
            <p>Skor kamu: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Main Lagi</button>
        </div>

    </div>

    <div class="info">
        ⬅️ Tekan <b>←</b> untuk ke kiri |
        Tekan <b>→</b> untuk ke kanan ➡️
    </div>

    <script>
        const game = document.getElementById("game");
        const player = document.getElementById("player");
        const scoreText = document.getElementById("score");
        const gameOverScreen = document.getElementById("gameOver");
        const finalScore = document.getElementById("finalScore");

        let playerX = 172;
        let score = 0;
        let gameSpeed = 5;
        let gameOver = false;

        // Membuat mobil musuh
        function createEnemy() {
            if (gameOver) return;

            const enemy = document.createElement("div");
            enemy.classList.add("enemy");

            // Posisi acak
            const maxX = game.clientWidth - 63;
            const randomX = Math.floor(Math.random() * maxX);

            enemy.style.left = randomX + "px";
            enemy.style.top = "-100px";

            game.appendChild(enemy);

            moveEnemy(enemy);
        }

        // Menggerakkan mobil musuh
        function moveEnemy(enemy) {
            let enemyY = -100;

            const interval = setInterval(() => {

                if (gameOver) {
                    clearInterval(interval);
                    return;
                }

                enemyY += gameSpeed;
                enemy.style.top = enemyY + "px";

                // Cek tabrakan
                if (isColliding(player, enemy)) {
                    clearInterval(interval);
                    endGame();
                }

                // Jika musuh sudah keluar layar
                if (enemyY > game.clientHeight) {
                    clearInterval(interval);

                    enemy.remove();

                    score++;
                    scoreText.innerText = "Skor: " + score;

                    // Game semakin cepat
                    if (score % 5 === 0) {
                        gameSpeed += 1;
                    }
                }

            }, 20);
        }

        // Mengecek tabrakan
        function isColliding(a, b) {

            const aRect = a.getBoundingClientRect();
            const bRect = b.getBoundingClientRect();

            return !(
                aRect.bottom < bRect.top ||
                aRect.top > bRect.bottom ||
                aRect.right < bRect.left ||
                aRect.left > bRect.right
            );
        }

        // Kontrol keyboard
        document.addEventListener("keydown", function(event) {

            if (gameOver) return;

            const maxX = game.clientWidth - player.offsetWidth;

            if (event.key === "ArrowLeft") {
                playerX -= 25;

                if (playerX < 0) {
                    playerX = 0;
                }

                player.style.left = playerX + "px";
            }

            if (event.key === "ArrowRight") {
                playerX += 25;

                if (playerX > maxX) {
                    playerX = maxX;
                }

                player.style.left = playerX + "px";
            }
        });

        // Game over
        function endGame() {
            gameOver = true;

            finalScore.innerText = score;
            gameOverScreen.style.display = "block";
        }

        // Mulai ulang
        function restartGame() {

            // Hapus semua mobil musuh
            document.querySelectorAll(".enemy").forEach(enemy => {
                enemy.remove();
            });

            playerX = 172;
            player.style.left = playerX + "px";

            score = 0;
            gameSpeed = 5;
            gameOver = false;

            scoreText.innerText = "Skor: 0";
            gameOverScreen.style.display = "none";
        }

        // Membuat musuh secara berkala
        setInterval(() => {
            createEnemy();
        }, 1200);

    </script>

</body>
</html>
